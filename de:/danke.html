<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, follow">
    <title>Anfrage gesendet | Ferienhaus Lézardrieux</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        :root { --primary: #1e3a8a; --text-main: #1f2937; --text-muted: #4b5563; --bg-body: #f9fafb; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-body); color: var(--text-main); line-height: 1.6;
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
        }
        main {
            max-width: 560px; background: #fff; border-radius: 12px; border: 1px solid #f3f4f6;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08); padding: 2.5rem 2rem; text-align: center;
        }
        h1 { color: var(--primary); font-size: 1.7rem; line-height: 1.25; margin-bottom: 1rem; }
        p { color: var(--text-muted); margin-bottom: 1rem; }
        .btn {
            display: inline-block; margin-top: 0.5rem; background: #b45309; color: #fff;
            padding: 0.85rem 1.8rem; border-radius: 8px; text-decoration: none; font-weight: 600;
        }
        .btn:hover { background: #92400e; }
        .btn:focus-visible { outline: 3px solid #d97706; outline-offset: 2px; }
    </style>
</head>
<body>
    <main>
        <h1>Ihre Anfrage wurde gesendet</h1>
        <p>Vielen Dank! Wir haben Ihre Buchungsanfrage für Le Gîte du Pêcheur in Lézardrieux erhalten. Wir antworten in der Regel innerhalb von 24 Stunden.</p>
        <p>Falls Sie unsere Antwort nicht finden, überprüfen Sie bitte Ihren Spam-/Junk-Ordner.</p>
        <a class="btn" href="/de/">Zurück zur Website</a>
    </main>
</body>
</html>
